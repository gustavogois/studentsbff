spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/studentsbff
    username: studentsbff
    password: studentsbff
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile, https://www.googleapis.com/auth/gmail.readonly
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent

jwt:
  secret: dev-secret-key-for-local-development-only-change-in-production-must-be-at-least-256-bits
  expiration: 86400000

frontend:
  url: http://localhost:5173

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o
  max-tokens: 2000

gmail:
  max-messages: 50
