spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

jwt:
  secret: test-secret-key-for-testing-only-must-be-at-least-256-bits-long-to-satisfy-hmac-sha256
  expiration: 3600000

frontend:
  url: http://localhost:5174

openai:
  api-key: test-api-key
  model: gpt-4o
  max-tokens: 2000

gmail:
  max-messages: 50
